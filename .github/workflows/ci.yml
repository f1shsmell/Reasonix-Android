name: ci

on:
  # Feature branches are checked once, through pull_request; a second push
  # run would only duplicate the same jobs under the same required names.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      # Documentation-only changes still report the required job names, but
      # skip the builds; skipped checks satisfy branch protection.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Every pattern must hold, so the negations actually exclude;
          # the default "some" would let "**" match every file.
          predicate-quantifier: "every"
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!release-notes/**"
              - "!latest.json"
              - "!design/**"

  web:
    name: Web · typecheck, test, build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  wire:
    name: Wire · kernel parity
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: esengine/DeepSeek-Reasonix
          # The pin is the last snapshot check-wire was verified against. Bump
          # it whenever the kernel contract changes on purpose — check-wire
          # failing on an intended contract change is the signal. Keep it
          # pinned so kernel-side drift is caught deliberately, not silently.
          ref: 2948ec98ec0cc3b2c8f5619a19c98ff98cd17e74
          path: kernel
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: REASONIX_KERNEL=kernel node scripts/check-wire.mjs

  android:
    name: Android · unit tests, debug APK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run build
      - name: Copy the web bundle into the Android shell
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android
      - name: Lint, unit tests and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: reasonix-for-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
