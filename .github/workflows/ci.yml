name: ci

on:
  # Feature branches are checked once, through pull_request; a second push
  # run would only duplicate the same jobs under the same required names.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    name: Android · unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run build
      - name: Copy the web bundle into the Android shell
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android
      - name: Lint, unit tests and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: reasonix-for-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
