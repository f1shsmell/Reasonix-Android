name: release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Tags are deliberate: a release requires a versioned note, matching versions,
# and a commit on main. The rule is in RELEASING.md; this workflow enforces it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to rebuild (recovery)"
        required: true
        type: string
      dry_run:
        description: "Build and verify the signed APK without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is releasable
        id: release
        env:
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${IN_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must be vMAJOR.MINOR.PATCH[-PRERELEASE], got: $tag"
            exit 1
          fi

          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin
          sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::$tag is not on main"
            exit 1
          fi

          version="${tag#v}"
          notes="release-notes/android/$version.md"
          if ! git cat-file -e "$sha:$notes" 2>/dev/null; then
            echo "::error::$notes must exist in the tagged commit before a release can build"
            exit 1
          fi

          props="$(git show "$sha:android/gradle.properties")"
          if ! grep -qx "reasonix.versionName=$version" <<<"$props"; then
            echo "::error::android/gradle.properties reasonix.versionName must be $version"
            exit 1
          fi
          package="$(git show "$sha:package.json")"
          if ! grep -q "\"version\": \"$version\"" <<<"$package"; then
            echo "::error::package.json version must be $version"
            exit 1
          fi

          { echo "tag=$tag"; echo "version=$version"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          echo "releasing $tag at $sha"

      - name: Check latest.json describes this release
        env:
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          sha, version = os.environ["SHA"], os.environ["VERSION"]

          def read(path):
              return subprocess.check_output(["git", "show", f"{sha}:{path}"]).decode("utf-8")

          props = read("android/gradle.properties")
          code = next(
              (int(line.split("=", 1)[1]) for line in props.splitlines()
               if line.startswith("reasonix.versionCode=")),
              0,
          )
          try:
              raw = read("latest.json")
          except subprocess.CalledProcessError:
              # v0.2.1 predates the in-app updater; its recovery rebuild has no manifest.
              legacy = tuple(int(part) for part in version.split("-")[0].split("."))
              if legacy <= (0, 2, 1):
                  print(f"::warning::tag {version} predates latest.json; publishing without it")
                  sys.exit(0)
              print("::error::latest.json is missing from the tagged commit; run npm run manifest")
              sys.exit(1)
          manifest = json.loads(raw)
          notes = read(f"release-notes/android/{version}.md").replace("\r\n", "\n").strip()
          apk = f"reasonix-for-android-{version}.apk"
          problems = []
          if manifest.get("tag") != f"v{version}":
              problems.append(f"tag is {manifest.get('tag')!r}, expected v{version}")
          if manifest.get("version") != version:
              problems.append(f"version is {manifest.get('version')!r}, expected {version}")
          if manifest.get("versionCode") != code:
              problems.append(f"versionCode is {manifest.get('versionCode')!r}, expected {code}")
          if manifest.get("apk") != apk:
              problems.append(f"apk is {manifest.get('apk')!r}, expected {apk}")
          if str(manifest.get("notes", "")).replace("\r\n", "\n").strip() != notes:
              problems.append("notes do not match the release note file")
          if problems:
              print("::error::latest.json does not describe this release: " + "; ".join(problems))
              sys.exit(1)
          print(f"latest.json matches {version} (versionCode {code})")
          PY

  build:
    name: Build APK
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: node ./node_modules/@capacitor/cli/bin/capacitor sync android
      - uses: ./.github/actions/restore-keystore
        with:
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build the signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain
      - name: Verify the signature
        working-directory: android
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Name the asset
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "reasonix-for-android-${VERSION}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: reasonix-for-android-${{ needs.resolve.outputs.version }}
          path: reasonix-for-android-*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish the release from its notes
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          asset="reasonix-for-android-${VERSION}.apk"
          notes="release-notes/android/${VERSION}.md"
          files=("$asset")
          if [[ -f latest.json ]]; then files+=("latest.json"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Reasonix For Android ${VERSION}" \
              --notes-file "$notes" \
              --verify-tag
          fi
