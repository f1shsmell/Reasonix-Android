apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def appVersionCode = (project.findProperty("reasonix.versionCode") ?: "1").toInteger()
def appVersionName = project.findProperty("reasonix.versionName") ?: "0.1.0"

android {
    namespace = "com.reasonix.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.reasonix.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // The wire fixtures are shared with the Vitest suite in ../fixtures, so a
    // contract change is one file rather than two hand-written examples.
    sourceSets {
        test {
            resources.srcDir rootProject.file("../fixtures")
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Notification behavior needs Android's NotificationManager; Robolectric
    // keeps it on the JVM so the build does not need an emulator.
    testImplementation "org.robolectric:robolectric:4.18"
    // Android's org.json is a stub in local unit tests; this gives AskStatus
    // the real parser without an instrumented run.
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // The relay checks the WebSocket Origin, which a WebView cannot set. The
    // native socket sets it explicitly; OkHttp carries the text frames.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

apply from: 'capacitor.build.gradle'

// An unsigned release APK cannot be installed and looks like a successful
// build. Fail at the task that produces it instead of at install time.
tasks.register("verifyReleaseSigning") {
    doLast {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException(
                    "Release signing is not configured. Copy android/keystore.properties.example " +
                    "to android/keystore.properties and fill it in, or build assembleDebug.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "assembleRelease" || task.name == "bundleRelease") {
        task.dependsOn("verifyReleaseSigning")
    }
}

// The scanner resolves MLKit's classes by reflection, so R8 cannot see the
// callers and will drop them as unreachable — which only shows up as a crash
// on a phone. AGP 9.4.1 did exactly that in 0.7.0: the first analysed frame
// threw and the plugin reported "There was an error scanning the barcode with
// ML Kit". The keep rules in proguard-rules.pro cover the packages; this task
// reads R8's own report and refuses a build that removed one of them anyway,
// so the CI release build catches a shrinker change the same day.
tasks.register("verifyBarcodeKept") {
    // R8 writes the removal report next to the release variant; this check runs
    // after it and reads that report rather than the dex.
    def usageFile = layout.buildDirectory.file("outputs/mapping/release/usage.txt")
    doLast {
        if (!usageFile.get().asFile.exists()) {
            throw new GradleException("No R8 report at ${usageFile.get().asFile}; " +
                    "run the release build before this check.")
        }
        def required = [
                "com.google.mlkit.vision.barcode.BarcodeScanning",
                "com.google.mlkit.vision.barcode.BarcodeScannerOptions\$Builder",
                "com.google.mlkit.vision.common.InputImage",
                "com.google.mlkit.vision.common.internal.ImageUtils",
                "com.google.mlkit.vision.common.internal.MobileVisionBase",
                "com.google.mlkit.vision.barcode.bundled.internal.ThickBarcodeScannerCreator",
        ]
        def removed = usageFile.get().asFile.readLines()
        def gone = required.findAll { name ->
            // usage.txt lists a removed class as "name:" on its own line.
            removed.any { it.trim() == "${name}:" }
        }
        if (!gone.isEmpty()) {
            throw new GradleException(
                    "R8 removed MLKit classes the barcode scanner needs, which makes " +
                    "scanning fail with 'There was an error scanning the barcode with ML Kit':\n  " +
                    gone.join("\n  ") +
                    "\nKeep them in android/app/proguard-rules.pro.")
        }
        logger.lifecycle("Barcode shrinker check: every required MLKit class survived R8.")
    }
}
tasks.configureEach { task ->
    if (task.name == "assembleRelease" || task.name == "bundleRelease") {
        task.finalizedBy("verifyBarcodeKept")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
